name: Fetch tool logos

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: logos
  cancel-in-progress: false

jobs:
  logos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - run: python scripts/fetch_logos.py
      - name: Commit new logos
        run: |
          git config user.name "benjiesiegel1414"
          git config user.email "benjiesbusiness@gmail.com"
          git add logos
          if git diff --cached --quiet; then
            echo "No new logos"
          else
            git commit -m "Tool logos: add logos for new listings"
            git pull --rebase
            git push
          fi
